  - find: '\b[gG]ate\b'
    replace: "gate"
    case_mode: sentence_aware
    regex: true
    manual: true
    notes: Yen Press exclusively uses "the gates" or "the gates to the faerie homeland", never "the fairy gates" or similar. Requires manual checking.

  - find: Imperial sage
